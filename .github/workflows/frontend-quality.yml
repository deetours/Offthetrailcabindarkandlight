name: Frontend Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run build
      - run: npm run test:e2e:smoke -- --project=chromium-desktop
      - run: npx playwright test tests/e2e/accessibility.spec.ts --project=chromium-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-quality-artifacts
          path: |
            playwright-report
            test-results
            test-artifacts
